<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FraudGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

    <div class="auth-container-centered">
        <div class="auth-card-modern glow-hover">
            <header class="auth-header">
                <h2 class="auth-title">Welcome Back!</h2>
                <p class="auth-subtitle">Log in to your secure vault to monitor payment safety.</p>
            </header>

            <div class="form-stack">
                <div class="form-group-modern">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@company.com" required class="input-modern">
                </div>

                <div class="form-group-modern">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required class="input-modern">
                </div>

                <button class="btn-primary-lg" onclick="login()">
                    Sign In to Account
                </button>
            </div>

            <div class="auth-footer-modern">
                <p>New to FraudGuard? <a href="register.html" class="link-modern">Create Account here</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
