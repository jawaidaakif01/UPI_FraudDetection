<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | FraudGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">⛨Fraud<span>Guard</span></div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="index.html" class="nav-item">
                    <span class="icon">⚡</span> Analyze Payment
                </a>
                <a href="link.html" class="nav-item"> 
                    <span class="icon">🔗</span> UPI ID Check
                </a>
                <a href="spam.html" class="nav-item">
                    <span class="icon">💬</span> Message Check
                </a>
                <a href="report.html" class="nav-item">
                    <span class="icon">🚩</span> Report Scam
                </a>
                <a href="admin.html" class="nav-item active">
                    <span class="icon">🛡️</span> Admin Panel
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-lg" onclick="logout()">
                    Sign Out
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="tool-card-wide glow-hover">
                <header class="auth-header">
                    <h2 class="auth-title" style="text-align: center;">Admin Command Center</h2>
                    <p class="auth-subtitle" style="text-align: center; color: var(--text-muted);">
                        Review flagged reports and manage global security protocols.
                    </p>
                </header>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div style="background: #F8FAFC; padding: 20px; border-radius: 20px; border: 1px solid var(--border);">
                        <small style="color: var(--text-muted); font-weight: 600;">PENDING REPORTS</small>
                        <h2 id="pendingCount" style="margin: 5px 0 0 0; color: #E11D48;">--</h2>
                    </div>
                    <div style="background: #F8FAFC; padding: 20px; border-radius: 20px; border: 1px solid var(--border);">
                        <small style="color: var(--text-muted); font-weight: 600;">SYSTEM HEALTH</small>
                        <h2 id="systemHealth" style="margin: 5px 0 0 0; color: #059669;">--</h2>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Reported ID</th>
                                <th>Confidence</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminReportTable">
                            </tbody>
                    </table>
                    <div id="emptyState" style="text-align: center; padding: 40px; color: var(--text-muted); display: none;">
                        <p>No pending fraud reports found.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
