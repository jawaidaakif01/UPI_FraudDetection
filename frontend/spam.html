<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Check | FraudGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body class="dashboard-body">

    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">⛨Fraud<span>Guard</span></div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon"></span> Dashboard
                </a>
                <a href="index.html" class="nav-item">
                    <span class="icon"></span> Analyze Payment
                </a>
                <a href="link.html" class="nav-item"> 
                    <span class="icon"></span> UPI ID Check
                </a>
                <a href="spam.html" class="nav-item active">
                    <span class="icon"></span> Message Check
                </a>
                <a href="report.html" class="nav-item">
                    <span class="icon"></span> Report Scam
                </a>
                <a href="admin.html" class="nav-item ">
                    <span class="icon"></span> Admin Panel
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-logout-lg" onclick="logout()">
                    Sign Out
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="tool-card-wide glow-hover">
                <header class="auth-header">
                    <h2 class="auth-title" style="text-align: center;">Message Analysis</h2>
                    <p class="auth-subtitle">Scan SMS, Emails, or UPI notes for phishing links and spam patterns.</p>
                </header>

                <div class="form-stack">
                    <div class="form-group-modern">
                        <label for="message">Paste Content Below</label>
                        <textarea id="message" class="input-modern" style="height: 200px; resize: none;"
                            placeholder="e.g. 'Your account is blocked. Click here to verify...'"></textarea>
                    </div>

                    <button class="btn-primary-lg" onclick="checkSpam()">
                        Scan Message for Risks
                    </button>
                </div>

                <div id="spamResult" class="result-display"></div>
                <button id="askAiBtn"
                    style="display: none; background-color: #5a4fcf; color: white; padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px;">
                    ✨ Ask AI Why
                </button>

                <div id="aiExplanationBox"
                    style="display: none; margin-top: 15px; padding: 15px; background-color: #f8fafc; border-left: 4px solid #5a4fcf; border-radius: 4px;">
                    <strong>AI Analysis:</strong>
                    <p id="aiExplanationText" style="margin-top: 8px; font-style: italic; color: #334155;">Loading
                        explanation...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>

</html>
