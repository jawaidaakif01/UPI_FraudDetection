<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Fraud Detection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-container register-card">
        <header>
            <div class="ai-badge">Get Started</div>
            <h2>Create Account</h2>
            <p>Join the neural network for secure payments.</p>
        </header>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@company.com" required>
        </div>

        <div class="form-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button class="btn-primary" onclick="register()">Register Now</button>

        <div class="auth-footer">
            <p>Already have an account? <a href="login.html" class="auth-link">Login here</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
