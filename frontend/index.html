<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI UPI Fraud Detection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="glass-container">
        <header>
            <div class="ai-badge">AI Powered</div>
            <h1>UPI Fraud Detection</h1>
            <p>Enter transaction details to assess security risk.</p>
        </header>

        <form id="fraudForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" placeholder="e.g. 5000" required>
                </div>

                <div class="form-group">
                    <label>Receiver Status</label>
                    <select id="is_new_receiver">
                        <option value="0">Existing Receiver</option>
                        <option value="1">New Receiver</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Request Type</label>
                    <select id="collect_request">
                        <option value="0">Direct Payment</option>
                        <option value="1">Collect Request</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Note Scanning</label>
                    <select id="suspicious_note">
                        <option value="0">Normal Note</option>
                        <option value="1">Suspicious Keywords Found</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Reported Issue</label>
                    <select id="issue_type">
                        <option value="Network Error">Network Error</option>
                        <option value="Incorrect MPIN">Incorrect MPIN</option>
                        <option value="Invalid UPI ID">Invalid UPI ID</option>
                        <option value="Beneficiary Not Found">Beneficiary Not Found</option>
                        <option value="Insufficient Funds">Insufficient Funds</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sender Bank</label>
                    <input type="text" id="bank_sender" placeholder="e.g. HDFC Bank" />
                </div>

                <div class="form-group">
                    <label>Receiver Bank</label>
                    <input type="text" id="bank_receiver" placeholder="e.g. SBI" />
                </div>

                <div class="form-group">
                    <label>Date & Time</label>
                    <div class="datetime-row">
                        <input type="date" id="date" required>
                        <input type="time" id="time" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-primary">Analyze Risk Score</button>
        </form>

        <div id="result"></div>

        <div class="footer-actions">
            <button class="btn-secondary" onclick="window.location.href='dashboard.html'">
                Go to Dashboard
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
