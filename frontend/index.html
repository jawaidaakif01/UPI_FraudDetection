<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | FraudGuard AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

    <div class="layout-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">⛨Fraud<span>Guard</span></div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="index.html" class="nav-item active">
                    <span class="icon">⚡</span> Analyze Payment
                </a>
                <a href="link.html" class="nav-item"> 
                  <span class="icon">🔗</span> UPI ID Check
                 </a>
                <a href="spam.html" class="nav-item">
                    <span class="icon">💬</span> Message Check
                </a>
                <a href="report.html" class="nav-item">
                    <span class="icon">🚩</span> Report Scam
                </a>
                <a href="admin.html" class="nav-item">
                    <span class="icon">🛡️</span> Admin Panel
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout-lg" onclick="logout()">
                    Sign Out
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="tool-card-wide glow-hover">
                <header class="auth-header">
                    <h2 class="auth-title" style="text-align: center;">Verify Transaction</h2>
                </header>

                <form id="fraudForm" class="form-stack">
                    <div class="form-grid-modern">
                        <div class="form-group-modern">
                            <label>Transaction Amount (₹)</label>
                            <input type="number" id="amount" placeholder="e.g. 5000" required class="input-modern">
                        </div>
                        <div class="form-group-modern">
    <label>Transaction / Issue Type</label>
    <select id="issue_type" class="input-modern" required>
        <option value="Standard Transfer">Standard Transfer</option>
        <option value="Invalid UPI ID">Invalid UPI ID</option>
        <option value="Beneficiary Not Found">Beneficiary Not Found</option>
        <option value="Multiple Failures">Multiple Failures</option>
    </select>
</div>
                        <div class="form-group-modern">
                            <label>Sender Bank</label>
                            <input type="text" id="bank_sender" placeholder="HDFC, SBI..." class="input-modern">
                        </div>
                        <div class="form-group-modern">
                            <label>Receiver Bank</label>
                            <input type="text" id="bank_receiver" placeholder="ICICI, Axis..." class="input-modern">
                        </div>
                        <div class="form-group-modern">
                            <label>Date</label>
                            <input type="date" id="date" required class="input-modern">
                        </div>
                        <div class="form-group-modern">
                            <label>Time</label>
                            <input type="time" id="time" required class="input-modern">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary-lg ">Run AI Risk Analysis</button>
                </form>

                <div id="result" class="result-display"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // Simple logout function
        function logout() {
            localStorage.removeItem("user_email");
            localStorage.removeItem("role");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
